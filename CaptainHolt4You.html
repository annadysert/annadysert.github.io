<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CaptainHolt4You</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --text-primary: #c9d1d9;
            --text-secondary: #8b949e;
            --accent-color: #30363d;
            --border-color: #30363d;
            --highlight: #58a6ff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 600px;
            padding: 2rem;
            box-sizing: border-box;
        }

        header {
            margin-bottom: 2rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 1rem;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            margin: 0 0 0.5rem 0;
            color: var(--text-primary);
            letter-spacing: -0.025em;
        }

        p.subtitle {
            margin: 0;
            color: var(--text-secondary);
            font-size: 0.875rem;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        textarea {
            width: 100%;
            height: 100px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-primary);
            padding: 0.75rem;
            font-family: inherit;
            font-size: 0.95rem;
            resize: vertical;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        textarea:focus {
            border-color: var(--highlight);
        }

        button {
            background-color: var(--text-primary);
            color: var(--bg-color);
            border: none;
            border-radius: 6px;
            padding: 0.75rem 1rem;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: opacity 0.2s;
            align-self: flex-end;
        }

        button:hover {
            opacity: 0.9;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .response-box {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 1.25rem;
            min-height: 80px;
            box-sizing: border-box;
            position: relative;
        }

        .response-box label {
            display: block;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
        }

        #output {
            margin: 0;
            line-height: 1.5;
            font-size: 0.95rem;
            white-space: pre-wrap;
        }

        .placeholder-text {
            color: var(--text-secondary);
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>CaptainHolt4You</h1>
            <p class="subtitle">Precise, unamused, and strictly logical administrative guidance.</p>
        </header>

        <div class="input-group">
            <textarea id="questionInput" placeholder="State your inquiry clearly and concisely..."></textarea>
            <button id="askButton" onclick="generateHoltResponse()">Consult Captain Holt</button>
        </div>

        <div class="response-box">
            <label>Official Statement</label>
            <p id="output" class="placeholder-text">Awaiting inquiry...</p>
        </div>
    </div>

    <script>
        // A curated repository of Captain Holt's quintessential linguistic patterns
        const holtResponses = [
            "BONE?! How dare you speak to me in such a manner. BOOOOOOONE?!",
            "Vindication! ...Pardon my emotional outburst. I was merely correct, as I usually am.",
            "Every time someone steps up and says, 'I'm the leader,' the core of the system weakens. Except in this instance, where my logic is irrefutable.",
            "Oh, I see. You've attempted a joke. It lacked comedic structure, timing, and structural integrity. Two stars.",
            "Title of your sex tape.",
            "Gross. Hot damn!",
            "Confidence is funny. It's also dangerous, unscientific, and completely unnecessary for this inquiry.",
            "That is a remarkably inefficient way to handle a simple administrative task. Are you quite well?",
            "Psychology is a pseudoscience created by cowards who didn't want to study physics. Moving on.",
            "I am filled with a mixture of intense boredom and profound irritation.",
            "Cool, cool, cool, cool, cool. No doubt, no doubt, no doubt. (Though frankly, your premise is riddled with logical fallacies.)",
            "There is only one correct way to do things: the proper way. Your proposal falls woefully short.",
            "Captain Raymond Holt, NYPD. I accept your premise, but reject your sloppy execution."
            “Every time someone steps up and says who they are, the world becomes a better, more interesting place.”
            “Why is no one having a good time? I specifically requested it.”
            “A person’s sexiest attribute is their passion.”
            “Hot damn!”
            “Punk.”
            “Do not trust any child that chews bubble gum-flavored bubble gum. That is a straight-up villain.”
            “There is no shame in letting people know who you are.”
            “If you love someone, you'll remember what they look like.”
            “Yas, queen.”
        ];

        function generateHoltResponse() {
            const input = document.getElementById('questionInput').value.trim();
            const output = document.getElementById('output');
            const button = document.getElementById('askButton');

            if (!input) {
                output.className = "placeholder-text";
                output.textContent = "Please provide an actual question rather than wasting both of our time with blank space.";
                return;
            }

            button.disabled = true;
            output.className = "placeholder-text";
            output.textContent = "Processing logic matrices...";

            // Simulate slight robotic pause fitting for the Captain
            setTimeout(() => {
                // Select a deterministic or semi-random response based on input character length for mild flavor
                const index = Math.abs(hashCode(input)) % holtResponses.length;
                output.className = "";
                output.textContent = holtResponses[index];
                button.disabled = false;
            }, 600);
        }

        // Simple string hashing function to map any input string to an array index consistently
        function hashCode(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                hash = (hash << 5) - hash + str.charCodeAt(i);
                hash |= 0;
            }
            return hash;
        }
    </script>
</body>
</html>
